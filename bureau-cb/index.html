<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082541">
  <title>Bureau du CB — Démonstration</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { min-height: 100svh; overflow: hidden; background: #09233d; color: #fff; }
    .room { position: relative; display: grid; min-height: 100svh; place-items: center; isolation: isolate; overflow: hidden; background: #09233d; }
    .room-background { position: absolute; z-index: 0; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; transform-origin: center; pointer-events: none; }
    .room::after { position: absolute; z-index: 1; inset: 0; content: ""; background: linear-gradient(180deg, rgba(4, 17, 32, .48), transparent 25%, transparent 64%, rgba(4, 17, 32, .48)); pointer-events: none; }
    .title { position: absolute; z-index: 2; top: max(22px, env(safe-area-inset-top)); left: max(22px, env(safe-area-inset-left)); margin: 0; padding: 12px 18px; border: 1px solid rgba(255, 211, 106, .8); border-radius: 14px; background: rgba(6, 29, 53, .8); box-shadow: 0 8px 24px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.08); color: #fff3ce; font-size: clamp(1.2rem, 3vw, 1.8rem); letter-spacing: .02em; }
    .home-link { position: absolute; z-index: 2; top: max(22px, env(safe-area-inset-top)); right: max(22px, env(safe-area-inset-right)); display: inline-flex; min-height: 46px; align-items: center; justify-content: center; gap: 7px; padding: 10px 16px; border: 1px solid rgba(255, 211, 106, .85); border-radius: 13px; background: rgba(6, 29, 53, .88); box-shadow: 0 6px 18px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.14); color: #fff3ce; font-weight: 800; text-decoration: none; }
    .home-link:hover { filter: brightness(1.15); transform: translateY(-1px); }
    .home-link:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .controls { position: absolute; z-index: 2; bottom: max(26px, env(safe-area-inset-bottom)); left: 50%; display: grid; justify-items: center; gap: 10px; width: min(92vw, 440px); transform: translateX(-50%); }
    .flip-button { min-height: 62px; width: 100%; padding: 14px 24px; border: 2px solid #ffe29a; border-radius: 16px; background: linear-gradient(180deg, #174e7e, #092c50); box-shadow: 0 7px 0 #051b32, 0 12px 28px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.32); color: #fff7df; font: inherit; font-size: clamp(1.05rem, 3vw, 1.3rem); font-weight: 800; cursor: pointer; touch-action: manipulation; transition: filter .15s ease, transform .15s ease, box-shadow .15s ease; }
    .flip-button:hover { filter: brightness(1.13); transform: translateY(-2px); }
    .flip-button:active { transform: translateY(4px); box-shadow: 0 3px 0 #051b32, 0 7px 16px rgba(0,0,0,.38); }
    .flip-button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .status { min-height: 1.3em; margin: 0; padding: 5px 12px; border-radius: 99px; background: rgba(5, 22, 39, .7); color: #fff; font-size: .9rem; text-align: center; text-shadow: 0 1px 3px #000; }
    .timer { min-width: 126px; padding: 8px 20px; border: 1px solid rgba(255, 226, 154, .8); border-radius: 14px; background: rgba(5, 22, 39, .84); box-shadow: 0 6px 18px rgba(0,0,0,.32); color: #fff1c9; font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; }
    .click-count { margin: 0; padding: 5px 14px; border-radius: 99px; background: rgba(5, 22, 39, .84); color: #fff; font-weight: 800; font-variant-numeric: tabular-nums; }
    .room.panicking .flip-button { border-color: #ffdc78; background: linear-gradient(180deg, #a42b22, #681a16); }
    .result-modal { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 24px; background: rgba(3, 14, 27, .72); backdrop-filter: blur(5px); }
    .result-modal[hidden] { display: none; }
    .result-card { display: grid; justify-items: center; gap: 16px; width: min(100%, 360px); padding: 26px; border: 2px solid #ffe29a; border-radius: 22px; background: linear-gradient(160deg, #123e66, #071d35); box-shadow: 0 20px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.1); text-align: center; }
    .result-card h2 { margin: 0; color: #fff1c9; font-size: 1.6rem; }
    .result-score { margin: 0; color: #fff; font-size: 1.2rem; }
    .result-score strong { display: block; margin-top: 6px; color: #ffd66d; font-size: 3rem; font-variant-numeric: tabular-nums; }
    .reward-result { margin: 0; color: #ffe7a5; font-weight: 800; }
    .reward-rules { max-width: 440px; margin: 0; padding: 8px 13px; border: 1px solid rgba(255,226,154,.35); border-radius: 12px; background: rgba(5,22,39,.78); color: #fff1c9; font-size: .86rem; text-align: center; }
    .ok-button { min-width: 130px; min-height: 48px; padding: 10px 24px; border: 1px solid #fff0bd; border-radius: 12px; background: linear-gradient(180deg, #f4c95d, #b87c1f); color: #1e2530; font: inherit; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #704711, 0 8px 18px rgba(0,0,0,.3); }
    .ok-button:hover { filter: brightness(1.08); }
    .ok-button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    .result-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%; }
    .home-button { display: inline-grid; place-items: center; min-width: 130px; min-height: 48px; padding: 10px 24px; border: 1px solid rgba(255,255,255,.7); border-radius: 12px; background: #244b6a; color: #fff; font: inherit; font-weight: 800; text-decoration: none; box-shadow: 0 4px 0 #102c44, 0 8px 18px rgba(0,0,0,.3); }
    .ok-button:disabled { cursor: not-allowed; filter: grayscale(.65); opacity: .65; }
    .room.shaking .room-background { animation: desk-shake .44s cubic-bezier(.36,.07,.19,.97) both; }
    @keyframes desk-shake { 10%, 90% { transform: translate3d(-2px, 1px, 0) rotate(-.15deg); } 20%, 80% { transform: translate3d(4px, -2px, 0) rotate(.22deg); } 30%, 50%, 70% { transform: translate3d(-7px, 3px, 0) rotate(-.32deg); } 40%, 60% { transform: translate3d(7px, -3px, 0) rotate(.3deg); } }
    @media (max-width: 640px) { .title { top: max(14px, env(safe-area-inset-top)); left: max(14px, env(safe-area-inset-left)); padding: 9px 13px; } .home-link { top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); min-height: 42px; padding: 8px 12px; font-size: .9rem; } .controls { bottom: max(18px, env(safe-area-inset-bottom)); width: calc(100% - 32px); } .flip-button { min-height: 58px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } .room.shaking .room-background { animation-duration: .12s; } }
  </style>
</head>
<body>
  <main class="room" id="room">
    <img class="room-background" id="roomBackground" src="../Vieil%20employ%C3%A9%20grognon%20au%20bureau.png?v=20261120" alt="" aria-hidden="true">
    <h1 class="title">Bureau du CB</h1>
    <a class="home-link" href="../" aria-label="Retourner à la page d'accueil">← Accueil</a>
    <section class="controls" aria-label="Mini-jeu de démonstration">
      <div class="timer" id="timer" aria-live="polite">Prêt ?</div>
      <p class="click-count" id="clickCount" aria-live="polite">Clics : 0</p>
      <p class="click-count" id="remainingAttempts">Tentatives restantes : connexion…</p>
      <button class="flip-button" id="flipButton" type="button">↻&nbsp; Retourner le bureau du CB</button>
      <p class="reward-rules">41 clics ou plus : 1 jeton classique · 51 clics ou plus : 2 jetons classiques</p>
      <p class="status" id="status" aria-live="polite">Le compte à rebours démarrera au premier clic.</p>
    </section>
  </main>
  <div class="result-modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
    <section class="result-card">
      <h2 id="resultTitle">Temps écoulé !</h2>
      <p class="result-score">Ton score<strong id="resultScore">0</strong></p>
      <p class="reward-result" id="resultReward" aria-live="polite"></p>
      <div class="result-actions">
        <button class="ok-button" id="replayButton" type="button">Rejouer · 5/5</button>
        <a class="home-button" href="https://pierrevalentin8.github.io/carte-popote/">Accueil</a>
      </div>
    </section>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-functions.js";
    const firebaseConfig = { apiKey: "AIzaSyCbm2aLX62NjJmO5nc__vaDiAt43arpfGY", authDomain: "cartes-et-popote.firebaseapp.com", projectId: "cartes-et-popote", storageBucket: "cartes-et-popote.firebasestorage.app", messagingSenderId: "1060360191291", appId: "1:1060360191291:web:96e35d7177d5d511220b1e" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const functions = getFunctions(app, "europe-west1");
    const callStartAttempt = httpsCallable(functions, "startBureauCbAttempt");
    const callFinishAttempt = httpsCallable(functions, "finishBureauCbAttempt");
    const callGetLeaderboard = httpsCallable(functions, "getBureauCbLeaderboard");
    const room = document.getElementById("room");
    const roomBackground = document.getElementById("roomBackground");
    const button = document.getElementById("flipButton");
    const status = document.getElementById("status");
    const timer = document.getElementById("timer");
    const clickCount = document.getElementById("clickCount");
    const resultModal = document.getElementById("resultModal");
    const resultScore = document.getElementById("resultScore");
    const resultReward = document.getElementById("resultReward");
    const replayButton = document.getElementById("replayButton");
    const remainingAttemptsLabel = document.getElementById("remainingAttempts");
    const maxAttempts = 5;
    let attemptsRemaining = 0;
    let activeAttemptId = "";
    function renderAttempts() {
      remainingAttemptsLabel.textContent = `Tentatives restantes : ${attemptsRemaining}/${maxAttempts}`;
      if (phase === "ready" && attemptsRemaining === 0) {
        button.disabled = true;
        status.textContent = "Tu as utilisé tes 5 tentatives du jour. Reviens demain !";
      } else if (phase === "ready") button.disabled = false;
      return attemptsRemaining;
    }
    let clicks = 0;
    let phase = "ready";
    let countdownTimer = null;
    let gameTimer = null;
    let gameEndsAt = 0;

    function shakeRoom() {
      room.classList.remove("shaking");
      void room.offsetWidth;
      room.classList.add("shaking");
    }

    async function startRound() {
      try {
        const response = (await callStartAttempt()).data || {};
        activeAttemptId = String(response.attemptId || "");
        attemptsRemaining = Math.max(0, Number(response.remainingAttempts) || 0);
        renderAttempts();
        if (!activeAttemptId) throw new Error("Impossible de démarrer cette tentative.");
      } catch (error) {
        phase = "ready";
        if (String(error?.code || "").includes("resource-exhausted")) attemptsRemaining = 0;
        roomBackground.src = "../Vieil%20employ%C3%A9%20grognon%20au%20bureau.png?v=20261120";
        room.classList.remove("panicking");
        button.textContent = "↻ Retourner le bureau du CB";
        renderAttempts();
        status.textContent = error?.message || "Impossible d’enregistrer ta tentative. Réessaie.";
        return;
      }
      phase = "running";
      roomBackground.src = "../Panique%20au%20bureau%20de%20la%20gendarmerie.png?v=20261120";
      room.classList.add("panicking");
      clicks = 0;
      clickCount.textContent = "Clics : 0";
      button.disabled = false;
      button.textContent = "💥 CLIQUE !";
      timer.textContent = "10";
      status.textContent = "Vite ! Clique le plus possible !";
      gameEndsAt = Date.now() + 10_000;
      gameTimer = window.setInterval(() => {
        const remaining = Math.max(0, Math.ceil((gameEndsAt - Date.now()) / 1000));
        timer.textContent = String(remaining);
        if (remaining === 0) {
          window.clearInterval(gameTimer);
          gameTimer = null;
          phase = "finished";
          button.disabled = true;
          button.textContent = "↻ Rejouer";
          status.textContent = `Temps écoulé ! Tu as fait ${clicks} clic${clicks === 1 ? "" : "s"}.`;
          resultScore.textContent = String(clicks);
          resultModal.hidden = false;
          resultReward.textContent = "Enregistrement du score et de la récompense…";
          replayButton.textContent = "Enregistrement…";
          replayButton.disabled = true;
          (async () => {
            try {
              let result;
              try { result = (await callFinishAttempt({ attemptId: activeAttemptId, clicks })).data || {}; }
              catch { result = (await callFinishAttempt({ attemptId: activeAttemptId, clicks })).data || {}; }
              attemptsRemaining = Math.max(0, Number(result.remainingAttempts) || 0);
              renderAttempts();
              const reward = Math.max(0, Number(result.tokensAwarded) || 0);
              resultReward.textContent = reward ? `Récompense : +${reward} jeton${reward === 1 ? "" : "s"} classique${reward === 1 ? "" : "s"} !` : "Pas de jeton cette fois. Reviens tenter ta chance !";
              replayButton.textContent = `Rejouer · ${attemptsRemaining}/${maxAttempts}`;
              replayButton.disabled = attemptsRemaining === 0;
            } catch (error) {
              resultReward.textContent = error?.message || "Le résultat n’a pas pu être enregistré. Recharge la page pour vérifier.";
              replayButton.textContent = "Rejouer · résultat à vérifier";
              replayButton.disabled = true;
            }
            replayButton.focus();
          })();
        }
      }, 100);
    }

    function beginAttempt() {
      if (attemptsRemaining <= 0) { renderAttempts(); return; }
      resultModal.hidden = true;
      phase = "countdown";
      roomBackground.src = "../Vieil%20employ%C3%A9%20grognon%20au%20bureau.png?v=20261120";
      room.classList.remove("panicking");
      button.disabled = true;
      button.textContent = "⏳ Prépare-toi…";
      let remaining = 3;
      timer.textContent = String(remaining);
      status.textContent = "Le bureau va être retourné…";
      countdownTimer = window.setInterval(() => {
        remaining -= 1;
        if (remaining > 0) {
          timer.textContent = String(remaining);
          return;
        }
        window.clearInterval(countdownTimer);
        countdownTimer = null;
        timer.textContent = "0";
        window.setTimeout(startRound, 300);
      }, 1000);
    }

    button.addEventListener("click", () => {
      if (phase === "ready" || phase === "finished") { beginAttempt(); return; }
      if (phase !== "running") return;
      clicks += 1;
      clickCount.textContent = `Clics : ${clicks}`;
      shakeRoom();
    });
    replayButton.addEventListener("click", beginAttempt);
    button.disabled = true;
    status.textContent = "Vérification de ton compte…";
    const currentUser = await new Promise((resolve) => {
      let unsubscribe = () => {};
      unsubscribe = onAuthStateChanged(auth, (user) => { unsubscribe(); resolve(user); }, () => { unsubscribe(); resolve(null); });
    });
    if (!currentUser) {
      status.textContent = "Connecte-toi sur Cartes & Popote pour jouer et recevoir tes jetons.";
      remainingAttemptsLabel.textContent = "Tentatives disponibles après connexion";
    } else {
      try {
        const state = (await callGetLeaderboard()).data || {};
        attemptsRemaining = Math.max(0, Number(state.remainingAttempts) || 0);
        renderAttempts();
        if (attemptsRemaining) status.textContent = "Le compte à rebours démarrera au premier clic.";
      } catch (error) {
        status.textContent = error?.message || "Impossible de vérifier tes tentatives. Recharge la page.";
      }
    }
    room.addEventListener("animationend", (event) => {
      if (event.animationName === "desk-shake") room.classList.remove("shaking");
    });
  </script>
</body>
</html>
